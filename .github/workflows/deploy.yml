name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Bootstrap TradeHouse credentials via GitHub OIDC
        shell: bash
        env:
          BOOTSTRAP_URL: https://tradehouse.app/api/companion/bootstrap
          OIDC_AUDIENCE: https://tradehouse.app/api/companion/bootstrap
        run: |
          set -euo pipefail

          TOKEN_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}")"
          TOKEN="$(printf '%s' "$TOKEN_JSON" | jq -er '.value | select(type == "string" and length > 20)')"

          RESP="$(curl --fail-with-body --silent --show-error \
            -X POST "$BOOTSTRAP_URL" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H 'Accept: application/json')"

          EXECUTOR_SECRET="$(printf '%s' "$RESP" | jq -er '.executor_secret | select(type == "string" and length > 0)')"
          CALLBACK_SECRET="$(printf '%s' "$RESP" | jq -er '.callback_secret | select(type == "string" and length > 0)')"

          echo "::add-mask::${EXECUTOR_SECRET}"
          echo "::add-mask::${CALLBACK_SECRET}"

          {
            printf 'COMPANION_EXECUTOR_SECRET=%s\n' "$EXECUTOR_SECRET"
            printf 'COMPANION_CALLBACK_SECRET=%s\n' "$CALLBACK_SECRET"
          } >> "$GITHUB_ENV"

          unset TOKEN TOKEN_JSON RESP EXECUTOR_SECRET CALLBACK_SECRET
          echo 'TradeHouse Companion credentials bootstrapped via GitHub OIDC.'

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          COMPANION_EXECUTOR_SECRET: ${{ env.COMPANION_EXECUTOR_SECRET }}
          COMPANION_CALLBACK_SECRET: ${{ env.COMPANION_CALLBACK_SECRET }}
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          # EXPLICIT, because the health budget below is now ~480s and relying on
          # the action's unstated default is how a slow boot gets cut off by a
          # number nobody chose. The build plus the wait must both fit inside it.
          command_timeout: 15m
          envs: COMPANION_EXECUTOR_SECRET,COMPANION_CALLBACK_SECRET
          script: |
            set -euo pipefail
            cd /home/companions

            git pull origin main
            export COMPANION_DEPLOY_SHA=$(git rev-parse HEAD)

            COMPANION_ENV=/home/companions/.env
            touch "$COMPANION_ENV"
            chmod 600 "$COMPANION_ENV"

            if [ -z "${COMPANION_EXECUTOR_SECRET:-}" ] || [ -z "${COMPANION_CALLBACK_SECRET:-}" ]; then
              echo 'OIDC bootstrap did not provide both Companion credentials; refusing deployment.' >&2
              exit 1
            fi

            tmp="$(mktemp)"
            grep -vE '^(COMPANION_EXECUTOR_BASE_URL|COMPANION_TRADEHOUSE_PILOT_ENABLED|COMPANION_EXECUTOR_SECRET|COMPANION_CALLBACK_SECRET|COMPANION_CALLBACK_HMAC_SECRET)=' "$COMPANION_ENV" > "$tmp" || true
            cat "$tmp" > "$COMPANION_ENV"
            rm -f "$tmp"

            printf '%s\n' 'COMPANION_EXECUTOR_BASE_URL=https://tradehouse.app' >> "$COMPANION_ENV"
            printf '%s\n' 'COMPANION_TRADEHOUSE_PILOT_ENABLED=true' >> "$COMPANION_ENV"
            printf 'COMPANION_EXECUTOR_SECRET=%s\n' "$COMPANION_EXECUTOR_SECRET" >> "$COMPANION_ENV"
            printf 'COMPANION_CALLBACK_SECRET=%s\n' "$COMPANION_CALLBACK_SECRET" >> "$COMPANION_ENV"
            chmod 600 "$COMPANION_ENV"

            unset COMPANION_EXECUTOR_SECRET COMPANION_CALLBACK_SECRET

            docker compose down --remove-orphans || true
            docker rm -f companions-companion-scanner-1 companions-companion-dashboard-1 2>/dev/null || true
            docker compose up -d --build
            docker compose ps

            # A GREEN DEPLOY THAT DID NOT DEPLOY AND A RED DEPLOY THAT DID ARE BOTH
            # LIES, AND THIS STEP WAS TELLING THE SECOND ONE.
            #
            # 2026-10-08 19:24: both containers printed Created and Started, the box
            # was serving normally 90 seconds later -- USOIL and BTC both RUNNING,
            # heartbeats ~50s, ok true -- and this step went RED. 20 attempts at
            # 5s timeout plus 3s sleep is 160 SECONDS of budget against a cold start
            # that took about four minutes, so it gave up on a healthy box.
            #
            # Worse, the failure said nothing: the loop leaves HEALTH empty and the
            # assertion below then parsed '' and died with
            # `JSONDecodeError: Expecting value: line 1 column 1 (char 0)`. That
            # cannot be told apart from a container that never started, which is the
            # same fault the gold read-health watch paid for -- the error body is
            # the answer and it was being thrown away.
            #
            # THE BUDGET IS RAISED AND THE COLD START IS MEASURED, not hidden. Four
            # minutes to serve is itself worth knowing: it is an outage on every
            # deploy and it will grow with the callback ledger. Widening the window
            # without printing the number would bury exactly that.
            HEALTH=''
            HEALTH_STARTED=$(date +%s)
            HEALTH_ELAPSED=0
            for attempt in $(seq 1 60); do
              HEALTH="$(curl --max-time 5 -fsS http://127.0.0.1:8082/health || true)"
              HEALTH_ELAPSED=$(( $(date +%s) - HEALTH_STARTED ))
              if [ -n "$HEALTH" ] && printf '%s' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("tradehouse") or {}; raise SystemExit(0 if t.get("executor_configured") is True and t.get("live_enable_requested") is True else 1)' 2>/dev/null; then
                break
              fi
              sleep 3
            done

            echo "COMPANION_TIME_TO_SERVE_SECONDS ${HEALTH_ELAPSED} (attempts up to 60, budget ~480s)"
            if [ -z "$HEALTH" ]; then
              echo "::error::The containers started but http://127.0.0.1:8082/health never answered within ${HEALTH_ELAPSED}s. This is NOT a parse failure and NOT proof the deploy did not happen -- check 'docker compose ps' above: if both containers read Started, the image is deployed and the app did not finish booting in time."
              docker compose ps || true
              docker compose logs --tail 40 companion-dashboard || true
              exit 1
            fi

            printf '%s' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("tradehouse") or {}; assert t.get("executor_configured") is True,d; assert t.get("live_enable_requested") is True,d'
            echo "Companion deployment verified in ${HEALTH_ELAPSED}s: TradeHouse transport configured, callback auth present, and pilot enabled."
