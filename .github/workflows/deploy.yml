name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            set -euo pipefail
            cd /home/companions

            git pull origin main
            export COMPANION_DEPLOY_SHA=$(git rev-parse HEAD)

            # Companion is a signal producer only. Reuse the already-authorized
            # TradeHouse credential installed for Gold on this same host without
            # printing or committing the secret anywhere.
            GOLD_ENV=/home/goldsignal/.env
            COMPANION_ENV=/home/companions/.env
            if [ -f "$GOLD_ENV" ]; then
              GOLD_EXECUTOR_SECRET="$(awk -F= '
                $1=="EXECUTOR_CALLBACK_SECRET" || $1=="TRADEHOUSE_EXECUTOR_SECRET" || $1=="EXECUTOR_SECRET" {
                  sub(/^[^=]*=/, ""); if (length($0)>0) { print; exit }
                }
              ' "$GOLD_ENV")"
              if [ -n "$GOLD_EXECUTOR_SECRET" ]; then
                touch "$COMPANION_ENV"
                chmod 600 "$COMPANION_ENV"
                tmp="$(mktemp)"
                grep -vE '^(COMPANION_EXECUTOR_SECRET|COMPANION_EXECUTOR_BASE_URL|COMPANION_TRADEHOUSE_PILOT_ENABLED)=' "$COMPANION_ENV" > "$tmp" || true
                cat "$tmp" > "$COMPANION_ENV"
                rm -f "$tmp"
                printf '%s\n' 'COMPANION_EXECUTOR_BASE_URL=https://tradehouse.app' >> "$COMPANION_ENV"
                printf '%s\n' 'COMPANION_TRADEHOUSE_PILOT_ENABLED=true' >> "$COMPANION_ENV"
                printf 'COMPANION_EXECUTOR_SECRET=%s\n' "$GOLD_EXECUTOR_SECRET" >> "$COMPANION_ENV"
                unset GOLD_EXECUTOR_SECRET
              fi
            fi

            # Fail closed before restart if TradeHouse authentication is absent.
            if ! grep -qE '^COMPANION_EXECUTOR_SECRET=.+$' "$COMPANION_ENV" 2>/dev/null; then
              echo 'Companion TradeHouse credential is unavailable; refusing an unconfigured deployment.' >&2
              exit 1
            fi

            # Clean stale Compose containers from interrupted/recreate runs.
            docker compose down --remove-orphans || true
            docker rm -f companions-companion-scanner-1 companions-companion-dashboard-1 2>/dev/null || true

            # Rebuild and start the isolated Companion services.
            docker compose up -d --build
            docker compose ps

            # Verify runtime transport readiness without sending a synthetic trade.
            HEALTH=''
            for attempt in $(seq 1 20); do
              HEALTH="$(curl --max-time 5 -fsS http://127.0.0.1:8082/health || true)"
              if [ -n "$HEALTH" ] && printf '%s' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("tradehouse") or {}; raise SystemExit(0 if t.get("executor_configured") is True and t.get("live_enable_requested") is True else 1)' 2>/dev/null; then
                break
              fi
              sleep 3
            done
            printf '%s' "$HEALTH" | python3 -c 'import json,sys; d=json.load(sys.stdin); t=d.get("tradehouse") or {}; assert t.get("executor_configured") is True,d; assert t.get("live_enable_requested") is True,d'
            echo 'Companion deployment verified: TradeHouse transport configured and pilot enabled.'
