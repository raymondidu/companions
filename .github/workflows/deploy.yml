name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          script: |
            # Navigate to your project directory on the droplet
            cd /home/companions
            
            # Fetch the latest changes
            git pull origin main

            # Expose the exact deployed source revision in scanner telemetry.
            export COMPANION_DEPLOY_SHA=$(git rev-parse HEAD)
            
            # Build and restart both isolated companion services.
            docker compose up -d --build 
           
