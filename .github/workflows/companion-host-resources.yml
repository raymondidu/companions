name: Companion Host Resources

# Measures the companion production host and says whether it is off its
# ceiling.
#
# WHY THIS DID NOT EXIST UNTIL NOW
#
# On 2026-09-11 at 18:42 this host degraded badly: all three markets went
# SCANNER_STALE with heartbeats of 214-285s, service.ok flipped to False,
# two qualified signals were lost to DELIVERY_ERROR, and a plain
# `docker ps` took 2m23s against a usual instant. The telemetry read took
# 2m58s against a usual 7s.
#
# And nothing in this repository could say whether that was memory, CPU,
# disk or the network, because nothing had ever measured the host. The
# Gold repo learned this lesson the hard way and has gold-host-resources;
# companions had no equivalent, so every diagnosis here was a guess.
#
# Owner instruction, 2026-09-11: processes must keep running and must not
# max the server out. That instruction is unenforceable on a box nobody
# measures, so this measures it.
#
# Read-only over SSH. Touches nothing on the host: no deploy, no restart,
# no container, no gate, no threshold, no strategy.

# WHY THIS ALSO CHAINS OFF companion-telemetry.yml
#
# This workflow was added to main at 19:01 UTC on 2026-09-11 with a cron of
# its own. Five scheduled slots passed -- 19:08, 19:38, 20:08, 20:38, 21:08 --
# and GitHub fired NONE of them. companion-host-resources.yml, added in the
# same commit with its own cron, had not run a single time either. Meanwhile
# companion-telemetry.yml, whose schedule predates both, fired reliably
# throughout on '3,18,33,48'.
#
# GitHub documents `schedule` as best-effort: runs are delayed under load and
# can be dropped entirely. A newly registered cron appears to be the weakest
# case of all. That is survivable for a workflow that prints state. It is not
# survivable for the one workflow whose entire job is to notice that a counter
# stopped moving -- a monitor that silently never runs is worse than no
# monitor, because it reports nothing and everyone reads that as nothing wrong.
# Exactly that happened on 2026-09-11: opened_signals sat frozen for twelve
# hours and every check said healthy.
#
# So this no longer depends on its own cron alone. It runs after every
# companion-telemetry run, which is a schedule GitHub has actually been
# honouring, and keeps its own cron and workflow_dispatch as extra chances to
# fire. The concurrency group already serialises overlapping runs, and a
# duplicate reading is harmless: the assertions compare against the previous
# reading whenever it came from.
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: ["Companion Production Telemetry"]
    types: [completed]

concurrency:
  group: companion-host-resources
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Measure the companion production host
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER }}
          key: ${{ secrets.DO_SSH_KEY }}
          port: 22
          timeout: 45s
          # Generous on purpose. A docker ps on this host took 2m23s on
          # 2026-09-11; a probe that times out during pressure tells you
          # nothing at exactly the moment you need it most.
          command_timeout: 8m
          script: |
            set -uo pipefail
            cd /home/companions 2>/dev/null || cd /

            echo "COMPANION_HOST_MEMORY"
            free -m || true

            echo "COMPANION_HOST_LOAD $(cat /proc/loadavg 2>/dev/null || echo unavailable)"
            echo "COMPANION_HOST_DISK"
            df -h / 2>/dev/null | tail -2 || true

            echo "COMPANION_CONTAINER_STATS"
            docker stats --no-stream --format \
              'COMPANION_CONTAINER {{.Name}} mem={{.MemUsage}} pct={{.MemPerc}} cpu={{.CPUPerc}}' || true

            echo "COMPANION_CONTAINER_STATE"
            docker ps --format 'COMPANION_PS {{.Names}} {{.Status}}' || true

            # An OOM kill is the difference between "it was slow" and "the
            # kernel shot it". Gold's dashboard was killed this way at
            # 15:50:03 and without dmesg that would have stayed a theory.
            echo "COMPANION_OOM_RECENT"
            # Kept in a file as well as printed, because the verdict below has
            # to READ this, not just display it. See the guard block.
            # An empty result has two very different causes -- no kills, or
            # dmesg refusing to be read -- and they must not look the same to
            # the verdict below. dmesg is probed first and its failure is
            # recorded explicitly, so "clean" is only ever claimed about a
            # buffer we actually read.
            if dmesg -T >/dev/null 2>&1; then
              dmesg -T 2>/dev/null | grep -iE 'out of memory|oom-kill|killed process' \
                > /tmp/companion_oom.txt || true
            else
              echo "DMESG_UNREADABLE" > /tmp/companion_oom.txt
            fi
            if [ -s /tmp/companion_oom.txt ]; then
              tail -15 /tmp/companion_oom.txt
            else
              echo "COMPANION_OOM_RECENT NONE_IN_BUFFER"
            fi

            # BOTH PROBES BELOW WERE READING A CONTAINER THAT DOES NOT EXIST.
            #
            # The containers on this host are named by compose:
            # companions-companion-scanner-1, companions-companion-dashboard-1.
            # This asked for "companion-scanner" and matched "^companion-", so
            # `docker logs` answered "Error response from daemon: No such
            # container" on every run since the day it was written, and the
            # restart loop printed nothing at all.
            #
            # Worse than useless: the log probe then fell through to
            # COMPANION_EVENT NONE_IN_WINDOW, which reads as "the scanner is
            # clean". It was never read. On 2026-09-12, with the kernel killing
            # a process on this box every few minutes, the one probe that would
            # say whether the SCANNER was surviving was answering "no events"
            # because it was pointed at nothing.
            #
            # Names are resolved from docker itself now, and a name that
            # resolves to nothing is reported as UNRESOLVED rather than clean.
            SCANNER="$(docker ps -a --format '{{.Names}}' \
              | grep -E 'companion[-_]?scanner' | head -1 || true)"
            DASHBOARD="$(docker ps -a --format '{{.Names}}' \
              | grep -E 'companion[-_]?dashboard' | head -1 || true)"
            echo "COMPANION_CONTAINERS_RESOLVED scanner=${SCANNER:-UNRESOLVED} dashboard=${DASHBOARD:-UNRESOLVED}"

            echo "COMPANION_RESTART_COUNTS"
            for c in $(docker ps -a --format '{{.Names}}' \
                       | grep -E 'companion' || true); do
              echo "COMPANION_RESTARTS $c $(docker inspect -f '{{.RestartCount}} {{.State.Status}} {{.State.OOMKilled}} {{.State.ExitCode}}' "$c" 2>/dev/null || echo '?')"
            done

            # A stale scanner and a crashed scanner look identical from
            # outside the container. Its own tail is the only thing that says
            # which, and the rare lines are the ones that matter.
            echo "COMPANION_SCANNER_EVENTS"
            if [ -z "$SCANNER" ]; then
              echo "COMPANION_EVENT UNRESOLVED no container matched a scanner name;"
              echo "COMPANION_EVENT this says NOTHING about scanner health."
            else
              docker logs --tail 4000 "$SCANNER" 2>&1 \
                | grep -aiE 'Traceback|CRITICAL|ERROR|SCANNER_STALE|DELIVERY_ERROR|database is locked|restart' \
                | tail -25 | sed "s/^/COMPANION_EVENT /" || true
              echo "COMPANION_SCANNER_TAIL $SCANNER"
              docker logs --tail 12 "$SCANNER" 2>&1 | sed "s/^/COMPANION_TAIL /" || true
            fi

            # WHOSE MEMORY IS THIS? A second goldsignal stack runs on this box
            # and is the largest consumer on it. Whether it is a live deployment
            # or an abandoned one is an owner decision that nobody can make
            # without knowing if it is doing anything, so read it: uptime, and
            # whether its scanner has logged anything recently.
            echo "COMPANION_FOREIGN_STACK"
            for c in $(docker ps -a --format '{{.Names}}' \
                       | grep -E '^goldsignal' || true); do
              echo "COMPANION_FOREIGN $c $(docker inspect -f '{{.State.Status}} started={{.State.StartedAt}} restarts={{.RestartCount}}' "$c" 2>/dev/null || echo '?')"
            done
            GOLDSCAN="$(docker ps -a --format '{{.Names}}' \
              | grep -E '^goldsignal.*scanner' | head -1 || true)"
            if [ -n "$GOLDSCAN" ]; then
              echo "COMPANION_FOREIGN_SCANNER_TAIL $GOLDSCAN"
              docker logs --tail 8 "$GOLDSCAN" 2>&1 | sed "s/^/COMPANION_FOREIGN_LOG /" || true
            else
              echo "COMPANION_FOREIGN_SCANNER none resolved"
            fi

            python3 - <<'PYGUARD'
            # Same thresholds and the same reasoning as the Gold guard, so the
            # two hosts are judged by one standard. 80% is where headroom stops
            # absorbing a spike; 90% is where a kill is imminent rather than
            # possible, so that is the line that fails the run.
            import re, subprocess
            from datetime import datetime

            WARN_PCT, FAIL_PCT = 80.0, 90.0

            # A KERNEL OOM KILL IS NOT A THRESHOLD. IT ALREADY HAPPENED.
            #
            # This guard collected dmesg OOM lines from the day it was written
            # and the verdict never looked at them. On 2026-09-12 the kernel
            # killed uvicorn five times in under two hours -- 02:56, 03:09,
            # 03:34, 04:33, 04:39, every one of them constraint=CONSTRAINT_NONE
            # and global_oom on a 1963MB box with ZERO swap -- and this guard
            # printed OK, because host memory read 76.8% and the only exit
            # condition was 90%.
            #
            # Percentages are a forecast. A kill is an outcome. A guard that
            # forecasts while outcomes are landing is not a guard, and this is
            # the third place in these repos where a number was computed,
            # printed and never enforced.
            OOM_WINDOW_HOURS = 6.0

            def sh(cmd):
                try:
                    return subprocess.run(cmd, shell=True, capture_output=True,
                                          text=True, timeout=60).stdout
                except Exception:
                    return ''

            mem = sh('free -m')
            row = next((l for l in mem.splitlines() if l.strip().startswith('Mem:')), '')
            swap = next((l for l in mem.splitlines() if l.strip().startswith('Swap:')), '')
            nums = [int(x) for x in re.findall(r'\d+', row)]
            swapn = [int(x) for x in re.findall(r'\d+', swap)]

            if len(nums) < 2:
                print('COMPANION_RESOURCE_GUARD UNREADABLE could not parse free -m')
                raise SystemExit(0)

            total, used = nums[0], nums[1]
            avail = nums[5] if len(nums) > 5 else None
            pct = 100.0 * used / total if total else 0.0
            swap_total = swapn[0] if swapn else 0

            verdict = ('OVER_CEILING' if pct >= FAIL_PCT else
                       'OVER_BUDGET' if pct >= WARN_PCT else 'OK')
            print('COMPANION_RESOURCE_GUARD %s used=%dMB total=%dMB pct=%.1f%% '
                  'available=%sMB swap=%dMB warn_at=%.0f%% fail_at=%.0f%%'
                  % (verdict, used, total, pct, avail, swap_total, WARN_PCT, FAIL_PCT))

            if swap_total == 0:
                print('COMPANION_RESOURCE_GUARD_NOTE swap is ZERO, so there is no '
                      'elastic headroom: the kernel goes straight from pressure '
                      'to killing a process.')

            # docker stats MemPerc is a percentage of the CONTAINER'S OWN
            # limit, not of the host. On this box nothing sets mem_limit, so
            # docker reports the host size as every container's limit and the
            # two happen to coincide -- which is exactly why this bug survived
            # here after being fixed on the Gold guard in goldsignal#45. The
            # day any container here gets a cap, the old label starts lying and
            # the ranking starts naming whichever container is most tightly
            # capped rather than the one holding the most memory.
            def to_mb(text):
                m = re.match(r'([\d.]+)\s*([KMGT]?i?B)$', text.strip(), re.I)
                if not m:
                    return None
                scale = {'B': 1.0/(1024*1024), 'KIB': 1.0/1024, 'MIB': 1.0,
                         'GIB': 1024.0, 'TIB': 1024.0*1024,
                         'KB': 1.0/1024, 'MB': 1.0, 'GB': 1024.0, 'TB': 1024.0*1024}
                factor = scale.get(m.group(2).upper())
                return float(m.group(1)) * factor if factor else None

            stats = sh("docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.MemPerc}} {{.CPUPerc}}'")
            worst, worst_mb, worst_share = None, 0.0, 0.0
            uncapped = []
            for line in stats.splitlines():
                m = re.match(r'(\S+)\s+(\S+) / (\S+)\s+([\d.]+)%\s+([\d.]+)%', line.strip())
                if not m:
                    continue
                name, usage, cap = m.group(1), m.group(2), m.group(3)
                used_mb, cap_mb = to_mb(usage), to_mb(cap)
                share = (100.0 * used_mb / total) if (used_mb is not None and total) else None
                # No cap at all: docker reports the host size as the limit, so
                # this container can take the whole machine down and leave the
                # kernel choosing the victim. That is what happened here.
                if cap_mb is not None and total and cap_mb >= total * 0.95:
                    uncapped.append(name)
                print('COMPANION_RESOURCE_CONTAINER %s mem=%s cap=%s used_mb=%s '
                      'pct_of_host=%s cpu_pct=%s'
                      % (name, usage, cap,
                         ('%.1f' % used_mb) if used_mb is not None else 'UNPARSEABLE',
                         ('%.1f' % share) if share is not None else 'UNKNOWN',
                         m.group(5)))
                if used_mb is not None and used_mb > worst_mb:
                    worst, worst_mb, worst_share = name, used_mb, (share or 0.0)
            if worst:
                print('COMPANION_RESOURCE_LARGEST %s holding %.1fMB, %.1f%% of the '
                      '%dMB host' % (worst, worst_mb, worst_share, total))
            if uncapped:
                print('COMPANION_RESOURCE_UNCAPPED %d container(s) here have no '
                      'mem_limit, so nothing bounds them and the kernel is the '
                      'only limiter: %s' % (len(uncapped), ', '.join(uncapped)))

            # THE KILLS THE PERCENTAGE DID NOT PREDICT.
            #
            # Read the dmesg lines the step above already saved. A global OOM
            # kill -- constraint=CONSTRAINT_NONE -- means the whole machine ran
            # out, not one cgroup, so the kernel picked victims wherever it
            # could reach: on 2026-09-12 it was invoked from sshd, dockerd and
            # containerd-shim, and killed uvicorn every time.
            kills = []
            try:
                with open('/tmp/companion_oom.txt') as handle:
                    raw = handle.read()
            except Exception:
                raw = ''
            now = datetime.now()
            for line in raw.splitlines():
                if 'killed process' not in line.lower():
                    continue
                stamp = re.match(r'\[(.{24})\]', line)
                if not stamp:
                    continue
                try:
                    when = datetime.strptime(stamp.group(1).strip(),
                                             '%a %b %d %H:%M:%S %Y')
                except ValueError:
                    continue
                age_h = (now - when).total_seconds() / 3600.0
                if 0 <= age_h <= OOM_WINDOW_HOURS:
                    victim = re.search(r'Killed process \d+ \((\S+?)\)', line)
                    kills.append((when.strftime('%H:%M:%S'),
                                  victim.group(1) if victim else 'unknown'))
            # Absence of evidence degrades. A buffer we could not read is not
            # a quiet kernel, and reporting it as clean is how a guard ends up
            # certifying the thing it was blind to.
            unreadable = 'DMESG_UNREADABLE' in raw
            print('COMPANION_OOM_VERDICT %s in the last %.0fh: %s'
                  % ('UNREADABLE' if unreadable else 'KILLS' if kills else 'NONE',
                     OOM_WINDOW_HOURS,
                     'dmesg could not be read, so nothing is claimed either way'
                     if unreadable else
                     ', '.join('%s %s' % k for k in kills) if kills else 'clean'))

            # Reported after the host verdict so a host emergency still wins
            # the exit message, but a kill that already landed is its own
            # failure and does not wait for a percentage to agree with it.
            if kills:
                raise SystemExit(
                    'The kernel OOM-killed %d process(es) on the companion host '
                    'in the last %.0f hours: %s. Host memory reads %.1f%% and '
                    'swap is %dMB, so the percentage thresholds did NOT and '
                    'will NOT catch this.'
                    % (len(kills), OOM_WINDOW_HOURS,
                       ', '.join('%s %s' % k for k in kills), pct, swap_total))

            if verdict == 'OVER_CEILING':
                raise SystemExit(
                    'Companion host at %.1f%% memory, at or past the %.0f%% ceiling. '
                    'A kill is imminent; the largest consumer is %s.'
                    % (pct, FAIL_PCT, worst))
            PYGUARD
            # CARRY THE GUARD'S EXIT STATUS OUT OF THE SCRIPT.
            #
            # This script runs under `set -uo pipefail` -- note the absent -e.
            # A non-zero exit from the heredoc above therefore does not abort
            # it, and the echo below reset $? to 0, so ssh-action saw a clean
            # exit and marked the run green no matter what the guard decided.
            #
            # Measured, not theorised. At 05:41 on 2026-09-12, forty minutes
            # after the OOM ceiling was merged, this workflow printed
            #
            #   The kernel OOM-killed 6 process(es) on the companion host in
            #   the last 6 hours: 03:09:35 ... 05:32:00
            #
            # and the run concluded SUCCESS. The host OVER_CEILING raise had
            # been in the same state since it was written: never able to fail.
            #
            # The guard was fixed to raise and the raise still went nowhere,
            # which is the same fault one layer further out than anyone looked.
            # A verdict that cannot fail the run is a print statement.
            guard_rc=$?

            echo "COMPANION_HOST_RESOURCES_COMPLETE"
            exit "$guard_rc"
