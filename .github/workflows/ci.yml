name: Companion Research Isolation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify-companions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q companion_*.py market_data.py
      # RUN THE WHOLE DIRECTORY, never a hand-maintained list.
      #
      # This step used to name five files. tests/test_companion_health_assert.py
      # was not among them, so the 23 tests guarding the health assertions --
      # the ones written specifically to catch the frozen opened_signals counter
      # of 2026-09-11 -- had never executed in CI once. They existed in the repo
      # and protected nothing, and nothing would have said so until the next
      # regression walked through the gap.
      #
      # A list has to be remembered. A directory does not. Every test file added
      # from here runs automatically, which is the only version of this that
      # stays true without anyone maintaining it.
      - name: Prove companion isolation, tournament and health contracts
        run: python -m pytest -q tests
      # NOTE: this step only checks constants in companion_markets.isolation_contract().
      # It is NOT a routing guard and will pass even if SILVER is added to
      # ACTIVE_PATHS. What may actually reach TradeHouse is asserted by the
      # live routing contract test, which the step above now runs as part of
      # the whole directory.
      - name: Static isolation-contract fields (not a routing guard)
        run: |
          python - <<'PY'
          from companion_markets import isolation_contract
          c=isolation_contract()
          assert c['paper_only'] is True
          assert c['live_authority'] is False
          assert c['tradehouse_delivery'] is False
          assert c['shares_gold_server'] is False
          assert c['dedicated_server_required'] is True
          print('COMPANION_RESEARCH_ISOLATED')
          PY
