name: companions

services:
  companion-scanner:
    image: companions-app
    build: .
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      COMPANION_DATA_DIR: /app/companion-data
      COMPANION_SCAN_INTERVAL_SECONDS: "60"
      COMPANION_DEPLOY_SHA: ${COMPANION_DEPLOY_SHA:-UNKNOWN}
      # Companion supplies only direction + fresh market reference price.
      # TradeHouse owns user capital, sizing, leverage and execution.
      COMPANION_EXECUTOR_BASE_URL: ${COMPANION_EXECUTOR_BASE_URL:-https://tradehouse.app}
      COMPANION_TRADEHOUSE_PILOT_ENABLED: ${COMPANION_TRADEHOUSE_PILOT_ENABLED:-true}
    command: python companion_runner.py
    volumes: [companion-data:/app/companion-data]

  companion-dashboard:
    image: companions-app
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      COMPANION_DATA_DIR: /app/companion-data
      COMPANION_SCAN_INTERVAL_SECONDS: "60"
      COMPANION_DEPLOY_SHA: ${COMPANION_DEPLOY_SHA:-UNKNOWN}
      COMPANION_EXECUTOR_BASE_URL: ${COMPANION_EXECUTOR_BASE_URL:-https://tradehouse.app}
      COMPANION_TRADEHOUSE_PILOT_ENABLED: ${COMPANION_TRADEHOUSE_PILOT_ENABLED:-true}
    command: uvicorn companion_app:app --host 0.0.0.0 --port 8082
    ports: ["8082:8082"]
    volumes: [companion-data:/app/companion-data]

volumes:
  companion-data:

# Research stays isolated from Gold. Only the explicitly selected Oil/BTC path
# may cross the TradeHouse transport boundary; all other tournament paths are paper-only.
